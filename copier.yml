_min_copier_version: "9.0.0"
_subdirectory: templates
_envops:
  trim_blocks: true
  lstrip_blocks: true
_skip_if_exists:
  - .xmake/mopk/deploy.json

project_name:
  type: str
  help: Project name
  default: my_plugin
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9_-]*$')) %} Use
    letters, digits, underscores or dashes, starting with a letter. {% endif %}

description:
  type: str
  help: Short project description
  default: ""

author:
  type: str
  help: Author
  default: ""

pre_commit:
  type: bool
  help: Include pre-commit formatting and lint hooks
  default: true

devbench_tests:
  type: bool
  help: Include DevBench tests using pytest
  default: false

devbench_api:
  type: bool
  help: Include the DevBench native API
  default: false

deploy_2_5_2:
  type: str
  help:
    Initial MO2 2.5.2 plugins/ directories separated by ; (leave blank to
    disable)
  default: ""

deploy_2_5_3beta12:
  type: str
  help:
    Initial MO2 2.5.3beta12 plugins/ directories separated by ; (leave blank to
    disable)
  default: ""
