_min_copier_version: "9.0.0"
_subdirectory: templates
_envops:
  trim_blocks: true
  lstrip_blocks: true
_exclude:
  - _partials
  - |
    {% if tooling_only %}
    **
    !/.clang-format
    !/.clang-tidy
    !/.clangd
    !/.editorconfig
    !/.gitattributes
    !/.gitignore
    !/.pre-commit-config.yaml
    !/.prettierignore
    !/.prettierrc.json
    !/.stylua.toml
    !/.vscode/
    !/.vscode/**
    !/{{ _copier_conf.answers_file }}
    {% endif %}
_skip_if_exists:
  - .xmake/mopk/deploy.json

tooling_only:
  type: bool
  help: Configure tooling for an existing project
  default: false

project_name:
  type: str
  help: Project name
  default: my_plugin
  when: "{{ not tooling_only }}"
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9_-]*$')) %} Use
    letters, digits, underscores or dashes, starting with a letter. {% endif %}

description:
  type: str
  help: Short project description
  default: ""
  when: "{{ not tooling_only }}"

author:
  type: str
  help: Author
  default: ""
  when: "{{ not tooling_only }}"

pre_commit:
  type: bool
  help: Include pre-commit formatting and lint hooks
  default: true

devbench_tests:
  type: bool
  help: Include DevBench tests using pytest
  default: false
  when: "{{ not tooling_only }}"

devbench_api:
  type: bool
  help: Include the DevBench native API
  default: false
  when: "{{ not tooling_only }}"

deploy_2_5_2:
  type: str
  help:
    Initial MO2 2.5.2 plugins/ directories separated by ; (leave blank to
    disable)
  default: ""
  when: "{{ not tooling_only }}"

deploy_2_5_3beta12:
  type: str
  help:
    Initial MO2 2.5.3beta12 plugins/ directories separated by ; (leave blank to
    disable)
  default: ""
  when: "{{ not tooling_only }}"

mopk_repository:
  type: str
  default: https://github.com/gabriel-andreescu/ModOrganizerPluginKit
  when: false

mopk_docs:
  type: str
  default: "{{ mopk_repository }}/blob/main/docs"
  when: false

mopk_version:
  type: str
  default: 0.2.0
  when: false
