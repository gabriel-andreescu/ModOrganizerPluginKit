[dependency-groups]
dev = [
    "modorganizer-plugin-kit[test]",
    "copier>=9.0,<10",
    "filelock>=3.20,<4",
    "pefile>=2023.2.7",
    "pre-commit>=4.6.2,<5",
    "pytest>=8.4,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16.7",
]

[tool.uv.sources]
modorganizer-plugin-kit = { workspace = true }

[tool.uv.workspace]
members = ["python"]

[tool.ruff]
target-version = "py311"
src = ["python/src"]
extend-exclude = ["scratch"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff.lint]
extend-select = ["I"]
